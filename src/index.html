<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Siman</title>
    <link rel="icon" href="../public/favicon-196x196.png">
    <link rel="stylesheet" href="./style/base.css">
</head>
<body>
    <header class="header">
        <div class="header__logo--container">
            <button id="hamburger-btn" class="header__logo--hamburgerButtom">☰</button>
            <div class="header__logo--img">
                <a href="#">
                    <img
                            id="logo-siman"
                            src="assets/logos/siman.com.svg"
                            alt="Siman"
                    >
                </a>
            </div>
        </div>

        <div class="header__search">
            <form action="">
                <label class="header__search--label">
                    <img src="./assets/logos/search.svg" alt="search">
                    <input type="text" placeholder="Search">
                </label>
            </form>
        </div>

        <div class="header__nav">
            <nav class="header__nav--list">
               <ul class="header__nav--list--items">
                   <li id="profile" class="header__nav--list--item">
                       <a href="#"><img src="./assets/logos/Profile.svg" alt="profile"></a>
                   </li>
                   <li id="shop-card" class="header__nav--list--item">
                       <a href="#"><img src="./assets/logos/carrito-white.svg" alt="carrito"></a>
                   </li>
               </ul>
            </nav>
        </div>
    </header>

    <aside id="side-menu" class="side-menu">
        <button id="close-btn" class="side-menu--close-btn">x</button>
        <ul>
            <li>1</li>
            <li>2</li>
            <li>3</li>
        </ul>
    </aside>

    <main class="main">
        <section class="slideshow">
            <div class="slideshow-container">
                <div class="mySlides fade">
                    <div>
                        <img
                                id="imgSlides1"
                                src="assets/images/slides/pantalla-large.webp"
                                alt="slides-1"
                        >
                    </div>
                    <div class="mySlides__items">
                        <p class="text">Pantallas</p>
                        <div class="mySlides__items--buttons">
                            <button class="prev" onclick="plusSlides(-1)">&#10094;</button>
                            <button class="next" onclick="plusSlides(1)">&#10095;</button>
                        </div>
                    </div>
                </div>

                <div class="mySlides fade">
                    <div>
                        <img
                                id="imgSlides2"
                                src="assets/images/slides/zapatos-large.gif"
                                alt="slides-2"
                        >
                    </div>
                    <div class="mySlides__items">
                        <p class="text">Zapatos</p>
                        <div class="mySlides__items--buttons">
                            <button class="prev" onclick="plusSlides(-1)">&#10094;</button>
                            <button class="next" onclick="plusSlides(1)">&#10095;</button>
                        </div>
                    </div>
                </div>

                <div class="mySlides fade">
                    <div>
                        <img
                                id="imgSlides3"
                                src="assets/images/slides/celulares-large.gif"
                                alt="slides-3"
                        >
                    </div>
                    <div class="mySlides__items">
                        <p class="text">Celulares</p>
                        <div class="mySlides__items--buttons">
                            <button class="prev" onclick="plusSlides(-1)">&#10094;</button>
                            <button class="next" onclick="plusSlides(1)">&#10095;</button>
                        </div>
                    </div>
                </div>

                <div class="mySlides fade">
                    <div>
                        <img
                                id="imgSlides4"
                                src="assets/images/slides/linea-blanca-large.webp"
                                alt="slides-4"
                        >
                    </div>
                    <div class="mySlides__items">
                        <p class="text">Linea Blanca</p>
                        <div class="mySlides__items--buttons">
                            <button class="prev" onclick="plusSlides(-1)">&#10094;</button>
                            <button class="next" onclick="plusSlides(1)">&#10095;</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="products">
            <div class="products__container">
                <h2>Promociones en las siguientes áreas</h2>

                <div class="products__container--items">
                    <div class="div1 card">
                        <div>
                            <img
                                    class="card__img"
                                    src="./assets/images/card/card-1-small.webp"
                                    alt="card"
                            >
                        </div>
                        <div class="card__content">
                            <div>
                                <h4 class="card__title">Hogar</h4>
                                <p class="card__text">Decoraciones y más</p>
                            </div>
                            <a href="#" class="card__link">Ver más</a>
                        </div>
                    </div>
                    <div class="div2 card">
                        <div>
                            <img
                                    class="card__img"
                                    src="./assets/images/card/card-2-small.webp"
                                    alt="card"
                            >
                        </div>
                        <div class="card__content">
                            <div>
                                <h4 class="card__title">Mujer</h4>
                            </div>
                            <a href="#" class="card__link">Ver más</a>
                        </div>
                    </div>
                    <div class="div3 card">
                        <div>
                            <img
                                    class="card__img"
                                    src="./assets/images/card/card-3-small.webp"
                                    alt="card"
                            >
                        </div>
                        <div class="card__content">
                            <div>
                                <h4 class="card__title">Hombre</h4>
                            </div>
                            <a href="#" class="card__link">Ver más</a>
                        </div>
                    </div>
                    <div class="div4 card">
                        <div>
                            <img
                                    class="card__img"
                                    src="./assets/images/card/card-4-small.webp"
                                    alt="card"
                            >
                        </div>
                        <div class="card__content">
                            <div>
                                <h4 class="card__title">Niños</h4>
                            </div>
                            <a href="#" class="card__link">Ver más</a>
                        </div>
                    </div>
                    <div class="div5 card">
                        <div>
                            <img
                                    class="card__img"
                                    src="./assets/images/card/card-5-small.webp"
                                    alt="card"
                            >
                        </div>
                        <div class="card__content">
                            <div>
                                <h4 class="card__title">Accesorios</h4>
                            </div>
                            <a href="#" class="card__link">Ver más</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">

    </footer>
</body>
<script src="./script/index.js"></script>
<script src="./script/slideshow.js"></script>
<script src="./script/changeImageforWidth.js"></script>
<script src="./script/aside-menu.js"></script>
</html>
